name: Generate Training CSVs

on:
  push:
    paths:
      - Training/emails.csv
      - Training/templates/*.template.csv
      - scripts/generate_training_csvs.py
  pull_request:
    paths:
      - Training/emails.csv
      - Training/templates/*.template.csv
      - scripts/generate_training_csvs.py

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CSV generator
        run: python scripts/generate_training_csvs.py

      - name: Verify generated files are up to date
        run: git diff --exit-code -- Training/Confidential-example.csv Training/Matlab-example.csv Training/Stata-example.csv