name: Generate Training CSVs

on:
  # Only on main: this event regenerates and commits the CSVs back. Leaving it
  # unscoped also fired it on same-repo PR branches, duplicating the
  # pull_request run below and pushing to the branch under review.
  push:
    branches: [main]
    paths:
      - Training/emails.csv
      - Training/templates/*.template.csv
      - scripts/generate_training_csvs.py
      - .github/workflows/generate-training-csvs.yml
  pull_request:
    paths:
      - Training/emails.csv
      - Training/templates/*.template.csv
      - scripts/generate_training_csvs.py
      - .github/workflows/generate-training-csvs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run CSV generator
        run: python scripts/generate_training_csvs.py

      # On a pull request the branch may live in a fork we cannot push to, so
      # there we only report that the committed CSVs are stale.
      - name: Verify generated files are up to date
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- 'Training/*-example.csv'

      - name: Commit regenerated CSVs
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- 'Training/*-example.csv'; then
            echo "Generated CSVs are already up to date; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Training/*-example.csv'
          git commit -m 'Regenerate training CSVs from emails.csv and templates'
          git push
          echo "### Regenerated training CSVs" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
