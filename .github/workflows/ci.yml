name: CI

on:
  pull_request:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      BASEURL: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Build with Jekyll
        # GitHub Pages serves this project site under /<repo-name>, so the
        # CI build must use the same baseurl for the link check to be valid.
        run: bundle exec jekyll build --baseurl "$BASEURL"
      - name: Install html-proofer
        run: gem install html-proofer --no-document
      - name: Check internal links
        run: htmlproofer ./_site --disable-external --allow-hash-href --ignore-urls "/mailto:/" --swap-urls "^$BASEURL/:/"

  # Deploy a live per-PR preview to Cloudflare Pages, for pull requests
  # opened from a branch of this repository (not a fork -- forks can't
  # read deploy secrets). Posts (or updates) the preview link as a PR
  # comment. See README-DEPLOYMENT.md for the one-time Cloudflare setup.
  preview:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # only for the PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        # Built without a baseurl -- Cloudflare Pages serves the preview
        # from its own domain, not under /LDI-Research-Aide.
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Compute Cloudflare Pages project name
        # Cloudflare Pages project names must be lowercase; the repo name is not.
        id: project
        run: echo "name=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Deploy PR preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ./_site
            --project-name=${{ steps.project.outputs.name }}
            --branch=pr-${{ github.event.pull_request.number }}

      - name: Publish preview link
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
        run: |
          echo "📖 Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
            --body "📖 **Preview:** $URL — commit \`${HEAD_SHA:0:7}\`"
