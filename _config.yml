title: AEA Research Aide Manual
description: Responsibilities and Instruction Manuals for the AEA Research Aide
theme: just-the-docs

url: https://aeadataeditor.github.io/LDI-Research-Aide # the base hostname & protocol for your site, e.g. http://example.com
